name: Python

on:
  push:
    branches: [main]
    paths: ["importers/**", "prices/**", "recommend/**", "tests/**", "db/seeds/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/python.yml"]
  pull_request:
    paths: ["importers/**", "prices/**", "recommend/**", "tests/**", "db/seeds/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/python.yml"]

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python (importers, prices, recommend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: Стартовый набор блюд актуален
        run: python -m importers.seed_recipes --check
      - name: pytest
        run: pytest --cov=importers --cov=prices --cov=jobs --cov-branch --cov-report=term-missing --cov-fail-under=95
